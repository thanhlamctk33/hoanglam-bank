# Example GitHub Actions workflow for the e2e suite.
# Copy to .github/workflows/e2e.yml to enable it.

name: e2e

on:
  push:
    branches: [main]
  pull_request:

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hoanglam
          POSTGRES_PASSWORD: hoanglam
          POSTGRES_DB: hoanglam_bank
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://hoanglam:hoanglam@localhost:5432/hoanglam_bank?schema=public
      JWT_SECRET: ci-secret-at-least-16-chars
      PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api
      NEXT_PUBLIC_ENABLE_DEMO_TOOLS: "true"
      # The suite generates ~10 failed logins per pass by design, which is the
      # production auth ceiling — and `retries: 2` can double that. Raise the
      # ceiling for CI only; the limiter itself stays on and is asserted in
      # tests/api/rate-limit.api.spec.ts.
      AUTH_RATE_LIMIT_MAX: "1000"
      GENERAL_RATE_LIMIT_MAX: "5000"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Migrate and seed the database
        working-directory: backend
        run: |
          npx prisma migrate deploy
          npm run seed

      - name: Install Playwright browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      # Playwright's webServer config starts the backend and frontend itself
      # and waits for /api/health before the first test runs.
      - name: Run e2e tests
        working-directory: e2e
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
