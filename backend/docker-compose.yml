services:
  postgres:
    image: postgres:16-alpine
    container_name: hoanglam-bank-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hoanglam
      POSTGRES_PASSWORD: hoanglam
      POSTGRES_DB: hoanglam_bank
    ports:
      - "5432:5432"
    volumes:
      - hoanglam_bank_pgdata:/var/lib/postgresql/data

volumes:
  hoanglam_bank_pgdata:
